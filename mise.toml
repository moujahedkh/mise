# ----------------------------------------------------------------- task ----

[tasks.bootstrap]
description = "Post-install sanity checks"
run = """
echo "java:      $(java --version 2>&1 | head -1)"
echo "node:      $(node --version 2>&1)"
echo "editor:    $EDITOR"
command -v starship >/dev/null && echo "starship:  ok" || echo "starship:  MISSING"
[ "$(readlink ~/.config/starship.toml)" = "$HOME/.config/mise/config/starship.toml" ] && echo "prompt:    linked" || echo "prompt:    NOT LINKED"
[ -r ~/.ssh/mise_private_key ] && echo "age key:   ok" || echo "age key:   MISSING"
"""
