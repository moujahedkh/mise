"$schema" = 'https://starship.rs/config-schema.json'

# Tokyo Night powerline prompt.
# Line 1: os/user > directory > git > toolchain > docker > time
# Line 2: duration + prompt character (exit status coloured)

palette = "tokyo_night"
add_newline = true

[palettes.tokyo_night]
rosewater = "#ff9e64"
flamingo = "#ff757f"
pink = "#bb9af7"
mauve = "#7aa2f7"
red = "#f7768e"
maroon = "#db4b4b"
peach = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
teal = "#73daca"
sky = "#7dcfff"
sapphire = "#2ac3de"
blue = "#565f89"
lavender = "#b4f9f8"
text = "#c0caf5"
subtext1 = "#a9b1d6"
subtext0 = "#9aa5ce"
overlay2 = "#737aa2"
overlay1 = "#565f89"
overlay0 = "#414868"
surface2 = "#3b4261"
surface1 = "#292e42"
surface0 = "#24283b"
base = "#1a1b26"
mantle = "#16161e"
crust = "#15161e"

[os]
disabled = true
style = "bg:mauve fg:crust"
format = "[ $symbol]($style)"

[os.symbols]
Macos = ""
Linux = ""
Ubuntu = ""
Debian = ""
Windows = ""

[username]
show_always = false
style_user = "bg:mauve fg:crust"
style_root = "bg:red fg:crust"
format = "[$user ]($style)"

[directory]
style = "bg:pink fg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "bg:pink fg:red"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"source" = " "

[git_branch]
symbol = ""
style = "bg:peach fg:crust"
format = "[ $symbol $branch(:$remote_branch) ]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = "bg:peach fg:crust"
format = "[($all_status$ahead_behind )]($style)"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[java]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[gradle]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[maven]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[nodejs]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[bun]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version)( $virtualenv) ]($style)"

[rust]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol $context ]($style)"
only_with_files = true

[time]
disabled = false
time_format = "%R"
style = "bg:blue fg:text"
format = "[  $time ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[ $duration ]($style)"
show_milliseconds = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[kubernetes]
disabled = false
