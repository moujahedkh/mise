# 09 Darcula -- JetBrains Darcula IDE palette, single line + right prompt
# generated for Ghostty 'JetBrains Darcula' (bg #202020) + FiraCode Nerd Font Mono
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
command_timeout = 500
scan_timeout = 10
palette = "darcula"
format = "$os$directory($git_branch$git_commit$git_state$git_status[](fg:green)) $character"
right_format = "$status$cmd_duration$jobs${python}${nodejs}${rust}${env_var.STARSHIP_GO}${env_var.STARSHIP_JAVA}${env_var.STARSHIP_GRADLE}${env_var.STARSHIP_MAVEN}${docker_context}${kubernetes}$time"

[palettes.darcula]
editor = "#2b2b2b"
panel = "#3c3f41"
text = "#a9b7c6"
orange = "#cc7832"
yellow = "#ffc66d"
green = "#6a8759"
blue = "#6897bb"
purple = "#9876aa"
red = "#bc3f3c"
gray = "#808080"
ok = "#6a8759"
err = "#bc3f3c"

[os]
disabled = false
format = "[ $symbol](fg:text bg:panel)[](fg:panel bg:orange)"

[os.symbols]
Macos = " "
Linux = " "
Ubuntu = " "
Debian = " "
Arch = " "
Fedora = " "
Alpine = " "
Redhat = " "
Windows = " "
Unknown = " "

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "
style = "fg:editor bg:orange"
read_only_style = "fg:err bg:orange"
format = "[ $path ]($style)[$read_only ]($read_only_style)[](fg:orange)"
repo_root_style = "bold fg:editor bg:orange"
before_repo_root_style = "fg:editor bg:orange"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only ]($read_only_style)[](fg:orange bg:green)"

[git_branch]
symbol = " "
style = "fg:editor bg:green"
format = "[ $symbol$branch ]($style)"

[git_commit]
only_detached = true
tag_disabled = false
commit_hash_length = 7
style = "fg:editor bg:green"
format = "[  $hash$tag ]($style)"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "~${count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
style = "bold fg:editor bg:green"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 2000
format = "[](fg:yellow)[  $duration ](fg:editor bg:yellow)"

[status]
disabled = false
symbol = " "
recognize_signal_code = true
format = "[](fg:red)[ $symbol$status ](fg:text bg:red)"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[](fg:panel)[ $time  ](fg:text bg:panel)"

[jobs]
symbol = " "
number_threshold = 1
format = "[](fg:purple)[ $symbol$number ](fg:editor bg:purple)"

[python]
symbol = " "
version_format = "${raw}"
format = "[](fg:yellow)[ $symbol${version}( $virtualenv) ](fg:editor bg:yellow)"

[nodejs]
symbol = " "
format = "[](fg:green)[ $symbol${version} ](fg:editor bg:green)"

[rust]
symbol = " "
format = "[](fg:orange)[ $symbol${version} ](fg:editor bg:orange)"

[env_var.STARSHIP_GO]
symbol = " "
format = "[](fg:blue)[ $symbol$env_value ](fg:editor bg:blue)"

[env_var.STARSHIP_JAVA]
symbol = " "
format = "[](fg:orange)[ $symbol$env_value ](fg:editor bg:orange)"

[env_var.STARSHIP_GRADLE]
symbol = " "
format = "[](fg:orange)[ $symbol$env_value ](fg:editor bg:orange)"

[env_var.STARSHIP_MAVEN]
symbol = " "
format = "[](fg:orange)[ $symbol$env_value ](fg:editor bg:orange)"

[docker_context]
symbol = " "
format = "[](fg:blue)[ $symbol$context ](fg:editor bg:blue)"

[kubernetes]
symbol = "☸ "
disabled = false
detect_env_vars = ["STARSHIP_KUBE"]
format = "[](fg:purple)[ $symbol$context ](fg:editor bg:purple)"

[character]
success_symbol = "[❯](bold fg:ok)"
error_symbol = "[❯](bold fg:err)"
vimcmd_symbol = "[❮](bold fg:ok)"

[git_state]
style = "fg:editor bg:green"
format = "[\\($state $progress_current/$progress_total\\) ]($style)"
