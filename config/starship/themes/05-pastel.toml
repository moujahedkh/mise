# 05 Pastel -- soft pastel powerline, single line + right prompt
# generated for Ghostty 'JetBrains Darcula' (bg #202020) + FiraCode Nerd Font Mono
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
command_timeout = 500
scan_timeout = 10
palette = "pastel"
format = "$os$directory($git_branch$git_commit$git_state$git_status[](fg:git)) $character"
right_format = "$status$cmd_duration$jobs${python}${nodejs}${rust}${env_var.STARSHIP_GO}${env_var.STARSHIP_JAVA}${env_var.STARSHIP_GRADLE}${env_var.STARSHIP_MAVEN}${docker_context}${kubernetes}$time"

[palettes.pastel]
dark = "#202020"
os = "#cba6f7"
dir = "#f5a9b8"
git = "#fab387"
lang = "#a6e3a1"
dur = "#f9e2af"
status = "#f38ba8"
jobs = "#89dceb"
time = "#b4befe"
ok = "#a6e3a1"
err = "#f38ba8"

[os]
disabled = false
format = "[ $symbol](fg:dark bg:os)[](fg:os bg:dir)"

[os.symbols]
Macos = " "
Linux = " "
Ubuntu = " "
Debian = " "
Arch = " "
Fedora = " "
Alpine = " "
Redhat = " "
Windows = " "
Unknown = " "

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "
style = "fg:dark bg:dir"
read_only_style = "fg:err bg:dir"
format = "[ $path ]($style)[$read_only ]($read_only_style)[](fg:dir)"
repo_root_style = "bold fg:dark bg:dir"
before_repo_root_style = "fg:dark bg:dir"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only ]($read_only_style)[](fg:dir bg:git)"

[git_branch]
symbol = " "
style = "fg:dark bg:git"
format = "[ $symbol$branch ]($style)"

[git_commit]
only_detached = true
tag_disabled = false
commit_hash_length = 7
style = "fg:dark bg:git"
format = "[  $hash$tag ]($style)"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "~${count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
style = "bold fg:dark bg:git"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 2000
format = "[](fg:dur)[  $duration ](fg:dark bg:dur)"

[status]
disabled = false
symbol = " "
recognize_signal_code = true
format = "[](fg:status)[ $symbol$status ](fg:dark bg:status)"

[time]
disabled = false
time_format = "%H:%M"
format = "[](fg:time)[ $time  ](fg:dark bg:time)"

[jobs]
symbol = " "
number_threshold = 1
format = "[](fg:jobs)[ $symbol$number ](fg:dark bg:jobs)"

[python]
symbol = " "
version_format = "${raw}"
format = "[](fg:lang)[ $symbol${version}( $virtualenv) ](fg:dark bg:lang)"

[nodejs]
symbol = " "
format = "[](fg:lang)[ $symbol${version} ](fg:dark bg:lang)"

[rust]
symbol = " "
format = "[](fg:lang)[ $symbol${version} ](fg:dark bg:lang)"

[env_var.STARSHIP_GO]
symbol = " "
format = "[](fg:lang)[ $symbol$env_value ](fg:dark bg:lang)"

[env_var.STARSHIP_JAVA]
symbol = " "
format = "[](fg:lang)[ $symbol$env_value ](fg:dark bg:lang)"

[env_var.STARSHIP_GRADLE]
symbol = " "
format = "[](fg:lang)[ $symbol$env_value ](fg:dark bg:lang)"

[env_var.STARSHIP_MAVEN]
symbol = " "
format = "[](fg:lang)[ $symbol$env_value ](fg:dark bg:lang)"

[docker_context]
symbol = " "
format = "[](fg:lang)[ $symbol$context ](fg:dark bg:lang)"

[kubernetes]
symbol = "☸ "
disabled = false
detect_env_vars = ["STARSHIP_KUBE"]
format = "[](fg:lang)[ $symbol$context ](fg:dark bg:lang)"

[character]
success_symbol = "[❯](bold fg:ok)"
error_symbol = "[❯](bold fg:err)"
vimcmd_symbol = "[❮](bold fg:ok)"

[git_state]
style = "fg:dark bg:git"
format = "[\\($state $progress_current/$progress_total\\) ]($style)"
