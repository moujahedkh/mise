# Dracula, powerlevel10k rainbow layout, rounded caps.
# left: os > [ssh host] > dir > git(+state)   right: toolchains docker jobs sudo status duration battery time
# RPROMPT: kubernetes (only in k8s projects, or when KUBECONFIG is set)
#
# Symlinked to ~/.config/starship.toml by the bootstrap final hook in mise.toml.

command_timeout = 1000
scan_timeout = 30

format = """\
[](fg:#6272a4)\
$os\
[](fg:#6272a4)\
$hostname\
[](fg:#bd93f9)\
$directory\
[](fg:#bd93f9)\
$git_branch\
$git_commit\
$git_status\
$git_state\
$git_metrics\
$fill\
$package\
$helm\
$terraform\
$java\
$gradle\
$maven\
$nodejs\
$python\
$docker_context\
$jobs\
$sudo\
$status\
$cmd_duration\
$battery\
$time
$character"""

right_format = "$kubernetes"

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol]($style)"
style = "fg:#282a36 bg:#6272a4"

[os.symbols]
Macos = "󰀵 "
Linux = "󰌽 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Arch = "󰣇 "
Alpine = " "
Windows = "󰍲 "

[hostname]
ssh_only = true
format = "[](fg:#ff5555)[ 󰢹 $hostname ]($style)[](fg:#ff5555)"
style = "fg:#f8f8f2 bg:#ff5555"

[directory]
format = "[  $path ]($style)[$read_only]($read_only_style)"
style = "fg:#f8f8f2 bg:#bd93f9"
read_only = "󰌾 "
read_only_style = "fg:#ff5555 bg:#bd93f9"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = '[](fg:#50fa7b)[ $symbol$branch(:$remote_branch)]($style)'
symbol = "  "
style = "fg:#282a36 bg:#50fa7b"

[git_status]
format = '[( $all_status$ahead_behind)]($style)'
style = "fg:#282a36 bg:#50fa7b"

[git_state]
format = '[ \($state( $progress_current/$progress_total)\)]($style)'
style = "fg:#ff5555 bg:#50fa7b"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICK"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

# Also draws the closing cap of the git segment, so it must stay enabled.
[git_metrics]
format = "( [+$added]($added_style))( [-$deleted]($deleted_style))[ ](bg:#50fa7b)[](fg:#50fa7b)"
added_style = "fg:#282a36 bg:#50fa7b"
deleted_style = "fg:#ff5555 bg:#50fa7b"
disabled = false

[git_commit]
only_detached = true
tag_disabled = false
commit_hash_length = 7
format = '[( $hash$tag)]($style)'
style = "fg:#282a36 bg:#50fa7b"

[package]
symbol = "󰏗 "
display_private = true
format = "[](fg:#ffb86c)[ $symbol$version ]($style)[](fg:#ffb86c)"
style = "fg:#282a36 bg:#ffb86c"

[helm]
symbol = "⎈ "
format = "[](fg:#8be9fd)[ $symbol$version ]($style)[](fg:#8be9fd)"
style = "fg:#282a36 bg:#8be9fd"

[terraform]
symbol = "󱁢 "
format = "[](fg:#bd93f9)[ $symbol$version ]($style)[](fg:#bd93f9)"
style = "fg:#282a36 bg:#bd93f9"

[java]
symbol = ""
format = "[](fg:#ff79c6)[ $symbol( $version) ]($style)[](fg:#ff79c6)"
style = "fg:#282a36 bg:#ff79c6"

[gradle]
symbol = ""
format = "[](fg:#bd93f9)[ $symbol( $version) ]($style)[](fg:#bd93f9)"
style = "fg:#282a36 bg:#bd93f9"

[maven]
symbol = ""
format = "[](fg:#bd93f9)[ $symbol( $version) ]($style)[](fg:#bd93f9)"
style = "fg:#282a36 bg:#bd93f9"

[nodejs]
symbol = ""
format = "[](fg:#8be9fd)[ $symbol( $version) ]($style)[](fg:#8be9fd)"
style = "fg:#282a36 bg:#8be9fd"

[python]
symbol = ""
format = "[](fg:#f1fa8c)[ $symbol( $version)( $virtualenv) ]($style)[](fg:#f1fa8c)"
style = "fg:#282a36 bg:#f1fa8c"

[docker_context]
symbol = ""
only_with_files = true
format = "[](fg:#8be9fd)[ $symbol $context ]($style)[](fg:#8be9fd)"
style = "fg:#282a36 bg:#8be9fd"

[jobs]
symbol = "✦"
number_threshold = 1
symbol_threshold = 1
format = "[](fg:#ff79c6)[ $symbol $number ]($style)[](fg:#ff79c6)"
style = "fg:#282a36 bg:#ff79c6"

[sudo]
disabled = true

[status]
disabled = false
recognize_signal_code = true
map_symbol = true
pipestatus = true
symbol = "✘"
not_executable_symbol = "󰂭"
not_found_symbol = "󰍉"
sigint_symbol = "󰟾"
signal_symbol = "󱐋"
format = "[](fg:#ff5555)[ $symbol $status( $signal_name) ]($style)[](fg:#ff5555)"
pipestatus_format = "[](fg:#ff5555)[ $symbol $pipestatus ]($style)[](fg:#ff5555)"
pipestatus_segment_format = "$status"
style = "fg:#f8f8f2 bg:#ff5555"

[cmd_duration]
min_time = 2000
format = "[](fg:#f1fa8c)[ 󱎫 $duration ]($style)[](fg:#f1fa8c)"
style = "fg:#282a36 bg:#f1fa8c"

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = "[](fg:#ff5555)[ $symbol $percentage ]($style)[](fg:#ff5555)"

[[battery.display]]
threshold = 20
style = "fg:#f8f8f2 bg:#ff5555"

[time]
disabled = false
time_format = "%R"
format = "[](fg:#44475a)[ 󱑍 $time ]($style)[](fg:#44475a)"
style = "fg:#f8f8f2 bg:#44475a"

[character]
success_symbol = '[❯](bold #50fa7b)'
error_symbol = '[❯](bold #ff5555)'

[kubernetes]
disabled = false
symbol = "󱃾 "
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml", "helmfile.yaml"]
detect_folders = ["k8s", "helm", "charts"]
detect_env_vars = ["KUBECONFIG"]
format = '[](inverted $style)[ $symbol$context( \($namespace\)) ]($style)[](inverted $style)'
style = "fg:#282a36 bg:#ff79c6"

[[kubernetes.contexts]]
context_pattern = "prod"
style = "fg:#282a36 bg:#ff5555"

[[kubernetes.contexts]]
context_pattern = "rancher-desktop"
context_alias = "rancher"
